[MAIN]
FPSLimit = 0                                   // max fps (0: unlimited/off)
FPSLimitMode = 1                               // 1: realtime (thread-lock)  -  2: accurate (sleep-yield)
FullScreenRefreshRateInHz = 0                  // overrides refresh rate selected by directx
DisplayFPSCounter = 1                          // displays fps and frametime on screen
ForceWindowedMode = 0                          // activates forced windowed mode
Direct3D8DisableMaximizedWindowedModeShim = 0  // Used to fix fullscreen issues for d3d8 games on windows 10. Do not use with ForceWindowedMode.
ResolutionScale = 100                          // internal resolution scale % (50-100 recommended)
GPUFocus = 1                                   // prioritize process and thread for GPU/CPU focus

[FORCEWINDOWED]
UsePrimaryMonitor = 0                          // move window to primary monitor
CenterWindow = 1                               // center window on screen
BorderlessFullscreen = 0                       // borderless fullscreen windowed mode
AlwaysOnTop = 0                                // window stays always on top
DoNotNotifyOnTaskSwitch = 0                    // window ignores focus loss

[COMPATIBILITY]
ForceDepthStencilD24S8 = 1                     // Ativa o formato correto para sombras
Force32BitBackBuffer = 1                       // Força cores em 32-bit para evitar dither/flicker
SafePresent = 1                                // Ativa a proteção contra crashes
ForceVSync = 0                                 // Mantenha 0 a menos que queira travar no refresh do monitor
FixShadowFlicker = 1                           // Ativa o conjunto de fixes específicos para Unreal Engine 2

[LOG]
EnableLogging = 1                              // enables logging to d3d8.log
EnableConsole = 0                              // enables console output for real-time debugging
